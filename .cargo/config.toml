[alias]
run-pico = "run --release -p pico_program --target thumbv8m.main-none-eabihf"
make-bindings = "run --release -p bindings_gen"

target = "thumbv8m.main-none-eabihf"

[build]


[target.thumbv8m.main-none-eabihf]

rustflags = [
    "-C",
    "link-arg=--nmagic",
    "-C",
    "link-arg=-Tlink.x",
    "-C",
    "link-arg=-Tdefmt.x",
    "-C",
    "target-cpu=cortex-m33",
]

# runner = "${PICOTOOL_PATH} load -u -v -x -t elf"
runner = "probe-rs run --chip RP235X --protocol swd"

[env]
DEFMT_LOG = "debug"
