[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "servo-reg-synnax-client"
version = "0.1.0"
description = "Synnax controller for the pico"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["prompt-toolkit>=3.0.0", "synnax>=0.40.0"]

[tool.setuptools]
packages = ["synnax-client-py"]
